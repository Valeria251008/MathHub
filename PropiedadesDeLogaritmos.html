<!DOCTYPE html>
<html>
    <head>
		<title>Propiedades de los Logarítmos</title>
        <meta charset="UTF-8">
        <style>
			 * {
				margin:0px;
			}
			
            .correcto { color: green; font-weight: bold; }
            .incorrecto { color: red; }
            .paso-completado { font-weight: bold; color: #333; margin: 10px 0; }
            .ayuda-texto { color: #555; font-style: italic; background: #f9f9f9; padding: 5px; border-left: 3px solid #ffd700; margin: 10px 0; }
            #btnAyuda { background-color: #ffd700; border: 1px solid #ccc; cursor: pointer; display: none; margin-left: 10px; }
            
            #cabecera{
				text-align:center;
				background-color:cornflowerblue;
				padding:20px;
			}
			
			#menu{
				text-align:center;
				padding:20px;
				background-color:white;
			}
            
            #contenido{
				border:2px solid blue;
				border-radius: 20px;
				padding:20px;
				margin:20px;
				text-align:center;
				background-color:white;
			}
			
			body {
			  font-family: "Delius", cursive;
			  font-weight: 400;
			  font-style: normal;
			  background-image: url('fondo_matematicas.png');

			}
			
			p,button {
				margin:8px;
			}
        </style>
        <link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Delius&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="cabecera">
            <h1>Propiedades de los Logarítmos</h1>
        </div>
        <div id="menu">
            <a href="Logarítmos.html">Logarítmos</a>
        </div>
        <div id="contenido">    
            <p><strong>log(4)+2log(x-3)=log(x)</strong></p>

            <div id="contenedorPaso1">
                <input type="text" id="respuesta1" placeholder="Escribe aquí tu respuesta">
                <button onclick="comprobarPaso1()">Comprobar</button>
            </div>

            <div id="contenedorPaso2" style="display: none;">
                <input type="text" id="respuesta2" placeholder="Siguiente paso...">
                <button onclick="comprobarPaso2()">Comprobar</button>
            </div>

            <div id="contenedorPaso3" style="display: none;">
                <input type="text" id="respuesta3" placeholder="Siguiente paso...">
                <button onclick="comprobarPaso3()">Comprobar</button>
            </div>
            
            <div id="contenedorPaso4" style="display: none;">
                <input type="text" id="respuesta4" placeholder="Siguiente paso...">
                <button onclick="comprobarPaso4()">Comprobar</button>
            </div>
            
            <div id="contenedorPaso5" style="display: none;">
                <input type="text" id="respuesta5" placeholder="Siguiente paso...">
                <button onclick="comprobarPaso5()">Comprobar</button>
            </div>
            
            <div id="contenedorPaso6" style="display: none;">
                <input type="text" id="respuesta6" placeholder="Último paso...">
                <button onclick="comprobarPaso6()">Comprobar</button>
            </div>
            
            <p><strong>Soluciones:</strong></p>
            
            <div id="contenedorSolucion1" style="display: none;">
                <input type="text" id="solucion1" placeholder="Primera solución">
                <button onclick="comprobarSolucion1()">Comprobar</button>
            </div>
            
            <div id="contenedorSolucion2" style="display: none;">
                <input type="text" id="solucion2" placeholder="Segunda solución">
                <button onclick="comprobarSolucion2()">Comprobar</button>
            </div>
            
            <button id="btnAyuda" onclick="mostrarAyuda()">¿Necesitas ayuda?</button>
            <p id="textoAyuda" class="ayuda-texto" style="display: none;"></p>

            <p id="mensaje"></p>
        </div>

        <script>
            // Respuestas correctas
            const paso1 = "log(4)+log(x-3)²=log(x)"; 
            const paso2 = "log(4·(x-3)²)=log(x)"; 
            const paso3 = "4·(x-3)²=x"; 
            const paso4 = "4·(x²-6x+9)=x";
            const paso5 = "4x²-24x+36=x";
            const paso6 = "4x²-25x+36=0";
            var soluciones = ["4", "2.25"];
            
            var pistas = {
                1: "Pista: Usa la propiedad del logaritmo de una potencia: n·log(a) = log(aⁿ).",
                2: "Pista: Usa la propiedad de la suma de logaritmos: log(a) + log(b) = log(a·b).",
                3: "Pista: Si log(A) = log(B), entonces A = B. Elimina los logaritmos.",
                4: "Pista: Desarrolla el binomio al cuadrado (x-3)² = (x² - 2·3x + 3²).",
                5: "Pista: Multiplica el 4 por todos los términos dentro del paréntesis.",
                6: "Pista: Pasa la 'x' de la derecha restando a la izquierda para igualar a cero.",
                "sol": "Pista: Resuelve la ecuación de segundo grado usando la fórmula general."
            };
            
            let pasoActual = 1; 
            let parrafoMensaje = document.getElementById("mensaje");
            let btnAyuda = document.getElementById("btnAyuda");
            let areaAyuda = document.getElementById("textoAyuda");

            function mostrarAyuda() {
                areaAyuda.textContent = pistas[pasoActual] || pistas["sol"];
                areaAyuda.style.display = "block";
            }

            function gestionarFallo() {
                parrafoMensaje.textContent = "Incorrecto. Inténtalo de nuevo.";
                parrafoMensaje.className = "incorrecto";
                btnAyuda.style.display = "inline-block"; 
            }

            function limpiarAyudaYPasar(siguientePaso) {
                parrafoMensaje.textContent = "";
                btnAyuda.style.display = "none";    
                areaAyuda.style.display = "none";   
                pasoActual = siguientePaso;         
            }

            function comprobarPaso1() {
                let textoIntroducido = document.getElementById("respuesta1").value.trim();
                if (textoIntroducido.toLowerCase() === paso1.toLowerCase()) {
                    document.getElementById("contenedorPaso1").innerHTML = '<p class="paso-completado">' + textoIntroducido + '</p>';
                    limpiarAyudaYPasar(2);
                    document.getElementById("contenedorPaso2").style.display = "block";
                } else { gestionarFallo(); }
            }
            
            function comprobarPaso2() {
                let textoIntroducido = document.getElementById("respuesta2").value.trim();
                if (textoIntroducido.toLowerCase() === paso2.toLowerCase()) {
                    document.getElementById("contenedorPaso2").innerHTML = '<p class="paso-completado">' + textoIntroducido + '</p>';
                    limpiarAyudaYPasar(3);
                    document.getElementById("contenedorPaso3").style.display = "block";
                } else { gestionarFallo(); }
            }

            function comprobarPaso3() {
                let textoIntroducido = document.getElementById("respuesta3").value.trim();
                if (textoIntroducido.toLowerCase() === paso3.toLowerCase()) {
                    document.getElementById("contenedorPaso3").innerHTML = '<p class="paso-completado">' + textoIntroducido + '</p>';
                    limpiarAyudaYPasar(4);
                    document.getElementById("contenedorPaso4").style.display = "block";
                } else { gestionarFallo(); }
            }

            function comprobarPaso4() {
                let textoIntroducido = document.getElementById("respuesta4").value.trim();
                if (textoIntroducido.toLowerCase() === paso4.toLowerCase()) {
                    document.getElementById("contenedorPaso4").innerHTML = '<p class="paso-completado">' + textoIntroducido + '</p>';
                    limpiarAyudaYPasar(5);
                    document.getElementById("contenedorPaso5").style.display = "block";
                } else { gestionarFallo(); }
            }

            function comprobarPaso5() {
                let textoIntroducido = document.getElementById("respuesta5").value.trim();
                if (textoIntroducido.toLowerCase() === paso5.toLowerCase()) {
                    document.getElementById("contenedorPaso5").innerHTML = '<p class="paso-completado">' + textoIntroducido + '</p>';
                    limpiarAyudaYPasar(6);
                    document.getElementById("contenedorPaso6").style.display = "block";
                } else { gestionarFallo(); }
            }

            function comprobarPaso6() {
                let textoIntroducido = document.getElementById("respuesta6").value.trim();
                if (textoIntroducido.toLowerCase() === paso6.toLowerCase()) {
                    document.getElementById("contenedorPaso6").innerHTML = '<p class="paso-completado">' + textoIntroducido + '</p>';
                    limpiarAyudaYPasar("sol");
                    document.getElementById("contenedorSolucion1").style.display = "block";
                } else { gestionarFallo(); }
            }

            function comprobarSolucion1() {
                let textoIntroducido = document.getElementById("solucion1").value.trim();
                let indice = soluciones.indexOf(textoIntroducido);
                if (indice !== -1) {
                    soluciones.splice(indice, 1);
                    document.getElementById("contenedorSolucion1").innerHTML = '<p class="paso-completado">' + textoIntroducido + '</p>';
                    limpiarAyudaYPasar("sol");
                    document.getElementById("contenedorSolucion2").style.display = "block";
                } else { gestionarFallo(); }
            }

            function comprobarSolucion2() {
                let textoIntroducido = document.getElementById("solucion2").value.trim();
                if (soluciones.includes(textoIntroducido)) {
                    document.getElementById("contenedorSolucion2").innerHTML = '<p class="paso-completado">' + textoIntroducido + '</p>';
                    limpiarAyudaYPasar("fin");
                    parrafoMensaje.textContent = "¡Correcto! Has resuelto la ecuación completa.";
                    parrafoMensaje.className = "correcto";
                } else { gestionarFallo(); }
            }
        </script>
    </body>
</html>
